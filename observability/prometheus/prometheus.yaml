global:
  scrape_interval:     15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: scg-proxy
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['scg-proxy:8080']   # Render internal DNS

  - job_name: main-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['main-app:8090']